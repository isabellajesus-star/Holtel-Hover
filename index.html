<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotelHover</title>
    <link rel="stylesheet" href="./css/formulario.css">
</head>
<body>
    <div class="container">
           
            <h1>HotelHover</h1>
            <form>

            <div class="form-control">
                <label for="destino">Destino:</label>
                <input type="text" id="destino" name="destino">
            </div>

            <div class="form-control">
                <label for="ocupacao">Ocupação:</label>
                <select id="ocupacao" name="ocupacao">
                    <option value="">Selecione</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>

          
          

            <div class="form-control">
                 <label for="hotel">Hotel:</label>
                <select id="hotel" name="hotel">
                    <option value="">Selecione</option>
                    <option value="1">Hotel Recanto das Flores</option>
                    <option value="2">Hotel Mabu Curitiba Business</option>
                    <option value="3">Hotel Bella Vista</option>
                    <option value="4">Hotel Curitiba Palace</option>
                </select>
            </div>

           
            <h1>Pagamento</h1>

            <div class="form-control">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-control">
                <label for="cartao">Número do cartão:</label>
                <input type="password" id="cartao" name="cartao">
            </div>

            <div class="form-control">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf">
            </div>

            <div class="form-control">
                <label for="rg">RG:</label>
                <input type="text" id="rg" name="rg">
            </div>
                 <div class="form-control">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">
            </div>


            <div class="form-control">
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" name="telefone">
            </div>

            <div class="form-control">
                <label for="data">Selecionar data:</label>
                <input type="date" id="data" name="data">
            </div>

            
            <div class="form-control">
                <button type="submit" class="btn-cadastro">Cadastrar</button>
                <button type="reset" class="btn-limpar">Limpar</button>
            </div>

        </form>
    </div>
</body>
</html>
